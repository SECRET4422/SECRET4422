<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200" role="img" aria-labelledby="title"><title id="title">Current focus: deep research, code security for AI agents, and developer workflows.</title><rect x="0.5" y="0.5" width="479" height="199" rx="10" fill="#0b1220" stroke="#23324a"/><text x="24" y="29" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#b9a2f5" letter-spacing="2">02 / CURRENT FOCUS</text><circle cx="29" cy="56" r="3" fill="#a48bee"/><text x="44" y="60" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#dbe5f5" >Research that goes deeper</text><text x="44" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#9caec5" >Search, citations and persistent context.</text><circle cx="29" cy="107" r="3" fill="#a48bee"/><text x="44" y="111" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#dbe5f5" >Safer code, smarter agents</text><text x="44" y="129" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#9caec5" >Security analysis for AI-generated code.</text><circle cx="29" cy="158" r="3" fill="#a48bee"/><text x="44" y="162" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#dbe5f5" >Better developer workflows</text><text x="44" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#9caec5" >Tools that catch regressions and break loops.</text></svg>
