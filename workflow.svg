<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="164" viewBox="0 0 1000 164" role="img" aria-labelledby="title"><title id="title">The AI tooling loop: research sources and verify claims, secure code, unblock repetitive bug loops, and validate invariants and regressions.</title><rect x="0.5" y="0.5" width="999" height="163" rx="10" fill="#0b1220" stroke="#23324a"/><text x="24" y="29" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#8ecfea" letter-spacing="2">THE AI TOOLING LOOP</text><text x="976" y="29" font-family="Segoe UI,Arial,sans-serif" font-size="9" fill="#7f93b0" text-anchor="end" letter-spacing="1">FOUR PROJECTS. ONE CONNECTED DIRECTION.</text><rect x="24" y="53" width="29" height="25" rx="6" fill="#172139" stroke="#2c3d58"/><text x="38.5" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#7bcfff" text-anchor="middle">01</text><text x="24" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e0e8f7" letter-spacing="1.2">RESEARCH</text><text x="24" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#9caec5" >Find sources. Verify claims.</text><path d="M70 65h178m-5-4 5 4-5 4" stroke="#344764" fill="none"/><rect x="270" y="53" width="29" height="25" rx="6" fill="#172139" stroke="#2c3d58"/><text x="284.5" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#b49bff" text-anchor="middle">02</text><text x="270" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e0e8f7" letter-spacing="1.2">SECURE</text><text x="270" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#9caec5" >Analyze code. Set guardrails.</text><path d="M316 65h178m-5-4 5 4-5 4" stroke="#344764" fill="none"/><rect x="516" y="53" width="29" height="25" rx="6" fill="#172139" stroke="#2c3d58"/><text x="530.5" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#85dfbd" text-anchor="middle">03</text><text x="516" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e0e8f7" letter-spacing="1.2">UNBLOCK</text><text x="516" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#9caec5" >Break repetitive bug loops.</text><path d="M562 65h178m-5-4 5 4-5 4" stroke="#344764" fill="none"/><rect x="762" y="53" width="29" height="25" rx="6" fill="#172139" stroke="#2c3d58"/><text x="776.5" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#f0cf89" text-anchor="middle">04</text><text x="762" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e0e8f7" letter-spacing="1.2">VALIDATE</text><text x="762" y="127" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#9caec5" >Check invariants. Catch regressions.</text></svg>
